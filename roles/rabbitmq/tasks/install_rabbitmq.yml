---
- name: Install RabbitMQ
  package:
    name:
      - rabbitmq-server
    state: present

- name: RabbitMQ local user
  user:
    name: rabbitmq
    create_home: no

- name: Create logs folder for RabbitMQ
  file:
    path: /data/00/logs/rabbitmq
    state: directory
    owner: rabbitmq
    group: rabbitmq
    mode: '0755'

- name: Create data folder for RabbitMQ
  file:
    path: /data/00/app/rabbitmq
    state: directory
    owner: rabbitmq
    group: rabbitmq
    mode: '0755'

- name: Create mnesia folder for RabbitMQ
  file:
    path: /data/00/app/rabbitmq/mnesia
    state: directory
    owner: rabbitmq
    group: rabbitmq
    mode: '0755'

- name: Create RabbitMQ conf dir
  file:
    path: /etc/rabbitmq/
    state: directory
    owner: rabbitmq
    group: rabbitmq
    mode: '0755'

- name: RabbitMQ conf file
  template:
    src: rabbitmq-env.conf.j2
    dest: /etc/rabbitmq/rabbitmq-env.conf
    owner: rabbitmq
    group: rabbitmq
    mode: '0644'

- name: RabbitMQ plugins
  template:
    src: rabbitmq_plugins.j2
    dest: /etc/rabbitmq/enabled_plugins
    owner: rabbitmq
    group: rabbitmq
    mode: '0644'
    
- name: RabbitMQ start
  systemd:
    name: rabbitmq-server
    state: started
    enabled: true
    daemon_reload: true

- name: Create RabbitMQ user
  rabbitmq_user:
    user: "{{ rabbitmq_user_name }}"
    password: "{{ rabbitmq_user_password }}"
    vhost: "{{ rabbitmq_vhost }}"
    configure_priv: ".*"
    read_priv: ".*"
    write_priv: ".*"
    tags: "{{ rabbitmq_tags }}"
    state: present
  become: true

- name: Delite RabbitMQ guest user
  rabbitmq_user:
    user: guest
    state: absent
    force: yes
